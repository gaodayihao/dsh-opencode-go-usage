# This project's whole dependency graph is the DSH prerelease family, published
# together in one batch — every `-rc.2` package fails the default release-age
# gate, and the transitive set grows whenever a dependency is bumped, so an
# allowlist can never stay current. The gate is therefore off for this repo:
# `pnpm install` of a committed lockfile must not depend on how long ago the
# DSH prereleases were published or on which day the lockfile was generated.
minimumReleaseAge: 0

# The published rc.2 client packages declare caret/`>=` ranges over their
# internal DSH dependencies, and npm's `latest` dist-tag for those internal
# packages is still an older prerelease — so the ranges cannot resolve without
# an explicit pin. These entries only affect THIS repository's dev install (the
# type-only SDK packages used to compile the plugin); the shipped runtime
# resolves every one of them from the dsh profile tree.
overrides:
  '@deepseek-ai/dsh-sandbox': '0.1.5-rc.2'
